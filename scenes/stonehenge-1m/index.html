<script type="importmap">
{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   CONSTANTS
   World axes:  +X = East, -Z = North, +Y = Up.
   Avenue runs from origin to NE (azimuth ~51° from North).
   ============================================================ */
const DEG = Math.PI / 180;

const SARSEN_RADIUS = 15.5;
const SARSEN_COUNT  = 30;
const SARSEN_H = 4.1, SARSEN_W = 2.1, SARSEN_D = 1.1;
const LINTEL_H = 0.85, LINTEL_D = 1.05;

const TRILITHON_COUNT    = 5;
const TRILITHON_HEIGHTS  = [6.6, 7.0, 7.3, 7.0, 6.6];
const TRILITHON_W = 2.4, TRILITHON_D = 1.3, TRILITHON_LINTEL_H = 1.0;
const TRILITHON_RADIUS   = 6.4;

const BLUESTONE_RADIUS   = 11.2;
const BLUESTONE_COUNT    = 40;
const BLUESTONE_H_RANGE  = [1.4, 2.4];

const AVENUE_AZIMUTH     = 51 * DEG;
const HEEL_STONE_DISTANCE = 60;

/* ============================================================
   CHEAP DETERMINISTIC 3D NOISE
   ============================================================ */
function fract(x) { return x - Math.floor(x); }
function hash3(x, y, z) {
  return fract(Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = smooth(xf), v = smooth(yf), w = smooth(zf);
  const c000 = hash3(xi,     yi,     zi);
  const c100 = hash3(xi + 1, yi,     zi);
  const c010 = hash3(xi,     yi + 1, zi);
  const c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi,     yi,     zi + 1);
  const c101 = hash3(xi + 1, yi,     zi + 1);
  const c011 = hash3(xi,     yi + 1, zi + 1);
  const c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + u * (c100 - c000);
  const x10 = c010 + u * (c110 - c010);
  const x01 = c001 + u * (c101 - c001);
  const x11 = c011 + u * (c111 - c011);
  const y0 = x00 + v * (x10 - x00);
  const y1 = x01 + v * (x11 - x01);
  return y0 + w * (y1 - y0);
}
function fbm3(x, y, z, oct = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) {
    s += a * noise3(x * f, y * f, z * f);
    f *= 2; a *= 0.5;
  }
  return s;
}
function clampByte(x) { return Math.max(0, Math.min(255, x | 0)); }

/* ============================================================
   PROCEDURAL TEXTURES
   ============================================================ */
function makeStoneTexture(seed = 0, palette = 'sarsen') {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const isBlue = palette === 'bluestone';

  const baseR = isBlue ? 92  : 138;
  const baseG = isBlue ? 100 : 124;
  const baseB = isBlue ? 110 : 105;
  ctx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
  ctx.fillRect(0, 0, 512, 512);

  // base speckle
  const img = ctx.getImageData(0, 0, 512, 512);
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (Math.random() - 0.5) * (isBlue ? 32 : 28);
    const tint = (Math.random() - 0.5) * 8;
    data[i]   = clampByte(data[i]   + n + (isBlue ? -tint : tint));
    data[i+1] = clampByte(data[i+1] + n);
    data[i+2] = clampByte(data[i+2] + n + (isBlue ? tint : -tint));
  }
  ctx.putImageData(img, 0, 0);

  // weathering bands
  for (let i = 0; i < 22; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const r = 50 + Math.random() * 140;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = Math.random() < 0.55;
    const tone = dark
      ? (isBlue ? 'rgba(35,40,50,'  : 'rgba(60,52,42,')
      : (isBlue ? 'rgba(140,150,160,' : 'rgba(180,170,150,');
    g.addColorStop(0, tone + (0.18 + Math.random() * 0.20) + ')');
    g.addColorStop(1, tone + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // cracks
  ctx.strokeStyle = isBlue ? 'rgba(20,22,30,0.6)' : 'rgba(40,32,24,0.55)';
  for (let i = 0; i < 14; i++) {
    ctx.lineWidth = 0.4 + Math.random() * 1.2;
    ctx.beginPath();
    let x = Math.random() * 512, y = Math.random() * 512;
    ctx.moveTo(x, y);
    const segs = 4 + Math.floor(Math.random() * 6);
    for (let j = 0; j < segs; j++) {
      x += (Math.random() - 0.5) * 90;
      y += (Math.random() - 0.5) * 90;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // lichen / moss patches — multiple irregular blobs per patch
  const lichenColors = isBlue
    ? [[140, 155, 95], [110, 130, 80], [180, 175, 110], [95, 110, 70], [205, 200, 130]]
    : [[200, 188, 110], [165, 150, 75], [125, 145, 85], [95, 115, 70], [215, 195, 130], [80, 95, 60]];

  const lichenCount = 70 + Math.floor(Math.random() * 30);
  for (let i = 0; i < lichenCount; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const baseR2 = 6 + Math.random() * 28;
    const c1 = lichenColors[Math.floor(Math.random() * lichenColors.length)];
    const blobs = 5 + Math.floor(Math.random() * 7);
    for (let j = 0; j < blobs; j++) {
      const dx = (Math.random() - 0.5) * baseR2 * 1.3;
      const dy = (Math.random() - 0.5) * baseR2 * 1.3;
      const rr = baseR2 * (0.35 + Math.random() * 0.65);
      const grad = ctx.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, rr);
      const alpha = 0.22 + Math.random() * 0.30;
      grad.addColorStop(0,     `rgba(${c1[0]},${c1[1]},${c1[2]},${alpha})`);
      grad.addColorStop(0.6,   `rgba(${c1[0]},${c1[1]},${c1[2]},${alpha * 0.5})`);
      grad.addColorStop(1,     `rgba(${c1[0]},${c1[1]},${c1[2]},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x + dx, y + dy, rr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // tiny dark mineral flecks
  for (let i = 0; i < 250; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const r = 0.5 + Math.random() * 1.6;
    ctx.fillStyle = `rgba(20,15,10,${0.35 + Math.random() * 0.4})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeStoneNormal(seed = 0) {
  const w = 512, h = 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const heights = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      heights[y * w + x] = fbm3(x * 0.04 + seed, y * 0.04 + seed, 1.7, 4);
    }
  }
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xL = (x - 1 + w) % w, xR = (x + 1) % w;
      const yU = (y - 1 + h) % h, yD = (y + 1) % h;
      const dx = (heights[y * w + xR] - heights[y * w + xL]) * 9;
      const dy = (heights[yD * w + x] - heights[yU * w + x]) * 9;
      const nx = -dx, ny = -dy, nz = 1;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      const i = (y * w + x) * 4;
      d[i]   = ((nx / len) * 0.5 + 0.5) * 255;
      d[i+1] = ((ny / len) * 0.5 + 0.5) * 255;
      d[i+2] = ((nz / len) * 0.5 + 0.5) * 255;
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

function makeStoneRoughness() {
  const w = 512, h = 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const n = fbm3(x * 0.018, y * 0.018, 4.4, 3);
      const v = clampByte(178 + (n - 0.5) * 110);
      const i = (y * w + x) * 4;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeChalkTexture() {
  const w = 1024, h = 1024;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const n  = fbm3(x * 0.008, y * 0.008, 0,   5);
      const m  = fbm3(x * 0.05,  y * 0.05,  0.5, 3);
      const md = fbm3(x * 0.002, y * 0.002, 9,   3);

      let r = 196 + n * 36 - m * 18;
      let g = 188 + n * 32 - m * 17;
      let b = 168 + n * 28 - m * 20;
      // chalk patches (high-n areas brighten significantly)
      if (n > 0.58) {
        const k = (n - 0.58) * 240;
        r += k; g += k * 0.96; b += k * 0.86;
      }
      // dirt/mud patches (low-n darken with warm tint)
      if (n < 0.42) {
        const k = (0.42 - n) * 120;
        r -= k * 0.55; g -= k * 0.65; b -= k * 0.78;
      }
      // long-wave blotches
      r += (md - 0.5) * 22; g += (md - 0.5) * 18; b += (md - 0.5) * 14;

      const i = (y * w + x) * 4;
      d[i]   = clampByte(r);
      d[i+1] = clampByte(g);
      d[i+2] = clampByte(b);
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // grass tufts hint
  for (let i = 0; i < 1800; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 0.8 + Math.random() * 3.2;
    ctx.fillStyle = `rgba(${100 + Math.random()*40}, ${130 + Math.random()*50}, ${65 + Math.random()*30}, ${0.18 + Math.random()*0.32})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  // pebbles / chalk fragments
  for (let i = 0; i < 1200; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 0.5 + Math.random() * 1.8;
    const dark = Math.random() < 0.6;
    ctx.fillStyle = dark
      ? `rgba(60,52,42,${0.30 + Math.random()*0.35})`
      : `rgba(245,240,225,${0.55 + Math.random()*0.35})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  tex.repeat.set(40, 40);
  return tex;
}

function makeChalkNormal() {
  const w = 512, h = 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  const heights = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      heights[y * w + x] =
        fbm3(x * 0.025, y * 0.025, 1.7, 4) * 0.7 +
        fbm3(x * 0.10,  y * 0.10,  3.1, 3) * 0.3;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xL = (x - 1 + w) % w, xR = (x + 1) % w;
      const yU = (y - 1 + h) % h, yD = (y + 1) % h;
      const dx = (heights[y * w + xR] - heights[y * w + xL]) * 6;
      const dy = (heights[yD * w + x] - heights[yU * w + x]) * 6;
      const nx = -dx, ny = -dy, nz = 1;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      const i = (y * w + x) * 4;
      d[i]   = ((nx / len) * 0.5 + 0.5) * 255;
      d[i+1] = ((ny / len) * 0.5 + 0.5) * 255;
      d[i+2] = ((nz / len) * 0.5 + 0.5) * 255;
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.repeat.set(40, 40);
  return tex;
}

/* ============================================================
   IRREGULAR STONE GEOMETRY — displaced BoxGeometry
   ============================================================ */
function makeIrregularStoneGeometry(width, height, depth, seed = 0, intensity = 0.16) {
  const segW = 5, segH = 9, segD = 5;
  const geom = new THREE.BoxGeometry(width, height, depth, segW, segH, segD);
  const pos = geom.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const sx = v.x * 0.6 + seed,        sy = v.y * 0.6 + seed,        sz = v.z * 0.6 + seed;
    const tx = v.x * 1.4 + seed + 13.7, ty = v.y * 1.4 + seed + 13.7, tz = v.z * 1.4 + seed + 13.7;
    const ux = v.x * 2.7 + seed + 27.3, uy = v.y * 2.7 + seed + 27.3, uz = v.z * 2.7 + seed + 27.3;
    const nx = noise3(sx, sy, sz) * 0.6 + noise3(ux, uy, uz) * 0.4;
    const ny = noise3(tx, ty, tz);
    const nz = noise3(sz, sx, sy) * 0.6 + noise3(ty, tz, tx) * 0.4;
    const bottomFalloff = 1 - smooth(Math.max(0, -v.y / (height * 0.5)));
    v.x += (nx - 0.5) * width  * intensity * 1.0;
    v.y += (ny - 0.5) * height * intensity * 0.45 * bottomFalloff;
    v.z += (nz - 0.5) * depth  * intensity * 1.0;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geom.computeVertexNormals();
  geom.computeBoundingBox();
  const c = new THREE.Vector3();
  geom.boundingBox.getCenter(c);
  geom.translate(-c.x, -c.y, -c.z);
  return geom;
}

/* ============================================================
   BARROWS — placed first so ground generation can reference them
   ============================================================ */
const BARROWS = (() => {
  const arr = [];
  const angles = [-2.4, -1.9, -1.3, -0.8, 0.5, 1.0, 1.5, 2.1, 2.7];
  for (const a of angles) {
    const dist = 180 + Math.random() * 130;
    arr.push({
      x: Math.sin(a) * dist,
      z: -Math.cos(a) * dist,
      r: 12 + Math.random() * 18,
      h: 1.6 + Math.random() * 2.6,
    });
  }
  return arr;
})();

/* ============================================================
   RENDERER + SCENE
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb3c8);
scene.fog = new THREE.Fog(0xc8d3df, 140, 520);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 1500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.target.set(0, 1.5, 0);

function avenueView() {
  // Camera SW of the circle, looking NE down the avenue toward the Heel Stone.
  const camPos = new THREE.Vector3(
    -Math.sin(AVENUE_AZIMUTH) * 30,
    7,
     Math.cos(AVENUE_AZIMUTH) * 30
  );
  camera.position.copy(camPos);
  controls.target.set(0, 2.0, 0);
  controls.update();
}
avenueView();

/* ============================================================
   LIGHTS
   ============================================================ */
const sun = new THREE.DirectionalLight(0xfff0c8, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left   = -55;
sun.shadow.camera.right  =  55;
sun.shadow.camera.top    =  55;
sun.shadow.camera.bottom = -55;
sun.shadow.camera.near   =  0.5;
sun.shadow.camera.far    =  320;
sun.shadow.bias = -0.00018;
sun.shadow.normalBias = 0.025;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xa6c4e0, 0x6b5848, 0.55);
scene.add(hemi);

/* ============================================================
   SKY — gradient + sun glow shader
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    uSunDir:   { value: new THREE.Vector3(0.5, 0.5, 0.5) },
    uSunColor: { value: new THREE.Color(0xfff0c8) },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;
    void main() {
      vec3 d = normalize(vDir);
      vec3 horizon = vec3(0.86, 0.84, 0.76);
      vec3 zenith  = vec3(0.32, 0.52, 0.82);
      float t = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(horizon, zenith, pow(t, 0.55));

      vec3 sd = normalize(uSunDir);
      float sunDot = max(0.0, dot(d, sd));
      // disc
      col += uSunColor * smoothstep(0.998, 0.9995, sunDot) * 4.0;
      // tight glow
      col += uSunColor * pow(sunDot, 64.0) * 0.9;
      // wide glow
      col += uSunColor * pow(sunDot, 6.0)  * 0.22;

      // horizon haze biased toward sun azimuth
      float hazeY = exp(-abs(d.y) * 5.5);
      vec2 dXZ = normalize(vec2(d.x, d.z) + 1e-5);
      vec2 sXZ = normalize(vec2(sd.x, sd.z) + 1e-5);
      float azDot = max(0.0, dot(dXZ, sXZ));
      vec3 hazeTint = mix(vec3(0.95, 0.78, 0.55), vec3(1.0, 0.9, 0.75), 0.5);
      col = mix(col, hazeTint, hazeY * pow(azDot, 4.0) * 0.30);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.BackSide,
  depthWrite: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 16), skyMat);
scene.add(sky);

/* ============================================================
   GROUND — chalk plain with rolling terrain + barrows
   ============================================================ */
const groundGeom = new THREE.PlaneGeometry(1200, 1200, 220, 220);
groundGeom.rotateX(-Math.PI / 2);
const gpos = groundGeom.attributes.position;
for (let i = 0; i < gpos.count; i++) {
  const x = gpos.getX(i);
  const z = gpos.getZ(i);
  const dist = Math.hypot(x, z);

  let h = 0;
  h += (fbm3(x * 0.015, z * 0.015, 0, 4) - 0.5) * 1.2;
  h += Math.sin(x * 0.005) * 0.30 + Math.cos(z * 0.004) * 0.45;

  for (const b of BARROWS) {
    const dx = x - b.x, dz = z - b.z;
    const dd = Math.hypot(dx, dz);
    if (dd < b.r) {
      h += b.h * Math.pow(Math.cos((dd / b.r) * Math.PI * 0.5), 2.0);
    }
  }

  // flatten near the monument
  if (dist < 32) {
    const k = dist / 32;
    h *= (k * 0.55 + 0.05);
  }
  gpos.setY(i, h);
}

// Sarsen outer circle: 30 stones; some fallen, with lintels only between adjacent standing.
function placeSarsenCircle() {
  const states = [];
  for (let i = 0; i < SARSEN_COUNT; i++) {
    const r = Math.random();
    states.push(r > 0.85 ? 0 : (r > 0.78 ? 2 : 1));
  }
  // ensure a continuous run of standing stones in the SW arc opposite the avenue
  // so the iconic silhouette is preserved
  for (let i = 8; i <= 22; i++) states[i] = 1;

  for (let i = 0; i < SARSEN_COUNT; i++) {
    const angle = (i / SARSEN_COUNT) * Math.PI * 2;
    const px = Math.sin(angle) * SARSEN_RADIUS;
    const pz = -Math.cos(angle) * SARSEN_RADIUS;
    const state = states[i];

    if (state === 1 || state === 2) {
      const h = state === 2 ? SARSEN_H * (0.4 + Math.random() * 0.3) : SARSEN_H;
      const geom = makeIrregularStoneGeometry(SARSEN_W, h, SARSEN_D, i * 7.13, 0.10);
      const mesh = new THREE.Mesh(geom, pickMat(sarsenMaterials, i));
      mesh.position.set(px, h * 0.5 - 0.05, pz);
      mesh.rotation.y = angle + (Math.random() - 0.5) * 0.05;
      mesh.rotation.z = (Math.random() - 0.5) * 0.04;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      stoneGroup.add(mesh);
    } else {
      const geom = makeIrregularStoneGeometry(SARSEN_W, SARSEN_H, SARSEN_D, i * 7.13, 0.10);
      const mesh = new THREE.Mesh(geom, pickMat(sarsenMaterials, i + 100));
      mesh.position.set(px, SARSEN_D * 0.55, pz);
      mesh.rotation.y = angle + Math.PI / 2;
      mesh.rotation.z = Math.PI / 2 + (Math.random() - 0.5) * 0.3;
      mesh.castShadow = true; mesh.receiveShadow = true;
      stoneGroup.add(mesh);
    }
  }

  // Lintels — only spanning two adjacent fully standing stones
  for (let i = 0; i < SARSEN_COUNT; i++) {
    if (states[i] !== 1 || states[(i + 1) % SARSEN_COUNT] !== 1) continue;
    const angA = (i / SARSEN_COUNT) * Math.PI * 2;
    const angB = ((i + 1) / SARSEN_COUNT) * Math.PI * 2;
    const angMid = (angA + angB) / 2;
    const px = Math.sin(angMid) * SARSEN_RADIUS;
    const pz = -Math.cos(angMid) * SARSEN_RADIUS;
    const dx = Math.sin(angB) * SARSEN_RADIUS - Math.sin(angA) * SARSEN_RADIUS;
    const dz = -Math.cos(angB) * SARSEN_RADIUS - (-Math.cos(angA) * SARSEN_RADIUS);
    const lintelLen = Math.hypot(dx, dz) + SARSEN_W * 0.20;

    const geom = makeIrregularStoneGeometry(lintelLen, LINTEL_H, LINTEL_D, i * 11.7 + 100, 0.05);
    const mesh = new THREE.Mesh(geom, pickMat(sarsenMaterials, i + 200));
    mesh.position.set(px, SARSEN_H + LINTEL_H * 0.5 - 0.08, pz);
    mesh.rotation.y = angMid + Math.PI / 2;
    mesh.castShadow = true; mesh.receiveShadow = true;
    stoneGroup.add(mesh);
  }
}
placeSarsenCircle();

// Trilithon horseshoe — opens NE toward the avenue
function placeTrilithons() {
  const arc = Math.PI * 1.05;
  for (let i = 0; i < TRILITHON_COUNT; i++) {
    const t = i / (TRILITHON_COUNT - 1);
    const angleOffset = (t - 0.5) * arc;
    const baseAngle = AVENUE_AZIMUTH + Math.PI + angleOffset;
    const px = Math.sin(baseAngle) * TRILITHON_RADIUS;
    const pz = -Math.cos(baseAngle) * TRILITHON_RADIUS;
    const h = TRILITHON_HEIGHTS[i];
    const tangent = new THREE.Vector3(Math.cos(baseAngle), 0, Math.sin(baseAngle));
    const sep = 0.55;

    for (const off of [-(TRILITHON_W * 0.5 + sep * 0.5), (TRILITHON_W * 0.5 + sep * 0.5)]) {
      const sx = px + tangent.x * off;
      const sz = pz + tangent.z * off;
      const seed = i * 17.3 + (off > 0 ? 1 : 2);
      const geom = makeIrregularStoneGeometry(TRILITHON_W, h, TRILITHON_D, seed, 0.10);
      const mesh = new THREE.Mesh(geom, pickMat(sarsenMaterials, seed | 0));
      mesh.position.set(sx, h * 0.5 - 0.05, sz);
      mesh.rotation.y = baseAngle;
      mesh.rotation.z = (Math.random() - 0.5) * 0.025;
      mesh.castShadow = true; mesh.receiveShadow = true;
      stoneGroup.add(mesh);
    }

    const lintelLen = TRILITHON_W * 2 + sep + 0.7;
    const lintelGeom = makeIrregularStoneGeometry(lintelLen, TRILITHON_LINTEL_H, TRILITHON_D, i * 13.7 + 50, 0.05);
    const lintel = new THREE.Mesh(lintelGeom, pickMat(sarsenMaterials, i + 300));
    lintel.position.set(px, h + TRILITHON_LINTEL_H * 0.5 - 0.1, pz);
    lintel.rotation.y = baseAngle + Math.PI / 2;
    lintel.castShadow = true; lintel.receiveShadow = true;
    stoneGroup.add(lintel);
  }
}
placeTrilithons();

/* ============================================================
   FENCE — low post-and-rope around the perimeter (gap on avenue)
   ============================================================ */
function placeFence() {
  const fenceRadius = 38;
  const postCount = 64;
  const postMat = new THREE.MeshStandardMaterial({ color: 0x53412e, roughness: 0.92 });
  const ropeMat = new THREE.LineBasicMaterial({ color: 0x3a2c1d });

  const postGeom = new THREE.BoxGeometry(0.13, 1.0, 0.13);
  const posts = new THREE.InstancedMesh(postGeom, postMat, postCount);
  posts.castShadow = true; posts.receiveShadow = true;
  const dummy = new THREE.Object3D();

  // Avenue gap: skip posts in a small arc centered on AVENUE_AZIMUTH
  const gapHalfAngle = 0.18;
  let placed = 0;
  for (let i = 0; i < postCount; i++) {
    const a = (i / postCount) * Math.PI * 2;
    let dAng = a - AVENUE_AZIMUTH;
    while (dAng > Math.PI) dAng -= Math.PI * 2;
    while (dAng < -Math.PI) dAng += Math.PI * 2;
    if (Math.abs(dAng) < gapHalfAngle) continue;
    dummy.position.set(Math.sin(a) * fenceRadius, 0.5, -Math.cos(a) * fenceRadius);
    dummy.rotation.y = a;
    dummy.updateMatrix();
    posts.setMatrixAt(placed++, dummy.matrix);
  }
  posts.count = placed;
  posts.instanceMatrix.needsUpdate = true;
  scene.add(posts);

  const segs = [];
  for (let i = 0; i < postCount; i++) {
    const a1 = (i / postCount) * Math.PI * 2;
    const a2 = ((i + 1) / postCount) * Math.PI * 2;
    let dAng1 = a1 - AVENUE_AZIMUTH; while (dAng1 > Math.PI) dAng1 -= Math.PI * 2; while (dAng1 < -Math.PI) dAng1 += Math.PI * 2;
    let dAng2 = a2 - AVENUE_AZIMUTH; while (dAng2 > Math.PI) dAng2 -= Math.PI * 2; while (dAng2 < -Math.PI) dAng2 += Math.PI * 2;
    if (Math.abs(dAng1) < gapHalfAngle || Math.abs(dAng2) < gapHalfAngle) continue;
    const x1 = Math.sin(a1) * fenceRadius, z1 = -Math.cos(a1) * fenceRadius;
    const x2 = Math.sin(a2) * fenceRadius, z2 = -Math.cos(a2) * fenceRadius;
    segs.push(x1, 0.85, z1, x2, 0.85, z2);
    segs.push(x1, 0.45, z1, x2, 0.45, z2);
  }
  const ropeGeom = new THREE.BufferGeometry();
  ropeGeom.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
  scene.add(new THREE.LineSegments(ropeGeom, ropeMat));
}
placeFence();

/* ============================================================
   GRASS — instanced blades with vertex-shader wind
   ============================================================ */
let grassUniforms = null;
let grassMesh = null;
const GRASS_MAX = 32000;

function makeGrass() {
  // Tapered blade: 5 verts, 3 triangles
  const verts = new Float32Array([
    -0.045, 0,    0,
     0.045, 0,    0,
    -0.030, 0.30, 0,
     0.030, 0.30, 0,
     0,     0.55, 0,
  ]);
  const idx = [0, 1, 2,  1, 3, 2,  2, 3, 4];
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geom.setIndex(idx);
  geom.computeVertexNormals();
  geom.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0.3, 0), 1.5);

  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 1, metalness: 0,
    side: THREE.DoubleSide,
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.uniforms.uWind = { value: 0.6 };
    grassUniforms = shader.uniforms;

    shader.vertexShader = `
      uniform float uTime;
      uniform float uWind;
      varying float vTipFactor;
    ` + shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      vec3 transformed = vec3( position );
      vec3 ipos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      float phase = uTime * 1.3 + ipos.x * 0.27 + ipos.z * 0.21;
      float bend = pow(max(0.0, position.y) / 0.55, 1.6);
      float sway = sin(phase) * 0.18 * uWind + sin(phase * 2.7 + 1.3) * 0.06 * uWind;
      transformed.x += sway * bend;
      transformed.z += cos(phase * 0.7) * 0.08 * uWind * bend;
      vTipFactor = max(0.0, position.y) / 0.55;
      `
    );

    shader.fragmentShader = `varying float vTipFactor;\n` + shader.fragmentShader.replace(
      'vec4 diffuseColor = vec4( diffuse, opacity );',
      `
      vec3 grassBase = vec3(0.27, 0.34, 0.16);
      vec3 grassMid  = vec3(0.45, 0.51, 0.24);
      vec3 grassTip  = vec3(0.72, 0.74, 0.42);
      vec3 grassCol = mix(grassBase, grassMid, smoothstep(0.0, 0.55, vTipFactor));
      grassCol = mix(grassCol, grassTip, smoothstep(0.55, 1.0, vTipFactor));
      vec4 diffuseColor = vec4(grassCol, opacity);
      `
    );
  };

  grassMesh = new THREE.InstancedMesh(geom, mat, GRASS_MAX);
  grassMesh.castShadow = false;
  grassMesh.receiveShadow = false;
  grassMesh.frustumCulled = false;

  const dummy = new THREE.Object3D();
  for (let i = 0; i < GRASS_MAX; i++) {
    let r;
    if (Math.random() < 0.65) r = 18 + Math.random() * 45;
    else                      r = 45 + Math.random() * 80;
    const a = Math.random() * Math.PI * 2;
    const x = Math.sin(a) * r;
    const z = -Math.cos(a) * r;
    let y = 0;
    for (const b of BARROWS) {
      const dx = x - b.x, dz = z - b.z;
      const dd = Math.hypot(dx, dz);
      if (dd < b.r) y += b.h * Math.pow(Math.cos((dd / b.r) * Math.PI * 0.5), 2.0);
    }
    dummy.position.set(x, y - 0.05, z);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    const s = 0.55 + Math.random() * 0.85;
    const sx = 0.7 + Math.random() * 0.6;
    dummy.scale.set(sx, s, sx);
    dummy.updateMatrix();
    grassMesh.setMatrixAt(i, dummy.matrix);
  }
  grassMesh.count = GRASS_MAX;
  grassMesh.instanceMatrix.needsUpdate = true;
  scene.add(grassMesh);
}
makeGrass();

/* ============================================================
   CROWD — instanced low-poly humanoid silhouettes
   ============================================================ */
let crowdMesh = null;

function makeCrowd() {
  const body = new THREE.CylinderGeometry(0.20, 0.18, 1.0, 6, 1);
  body.translate(0, 1.0, 0);

  const head = new THREE.SphereGeometry(0.14, 8, 6);
  head.translate(0, 1.65, 0);

  const armL = new THREE.CylinderGeometry(0.05, 0.04, 0.7, 5, 1);
  armL.translate(0, 1.15, 0); armL.rotateZ(0.10); armL.translate(-0.24, 0, 0);

  const armR = new THREE.CylinderGeometry(0.05, 0.04, 0.7, 5, 1);
  armR.translate(0, 1.15, 0); armR.rotateZ(-0.10); armR.translate(0.24, 0, 0);

  const legL = new THREE.CylinderGeometry(0.08, 0.07, 0.5, 5, 1);
  legL.translate(0, 0.25, 0); legL.translate(-0.09, 0, 0);

  const legR = new THREE.CylinderGeometry(0.08, 0.07, 0.5, 5, 1);
  legR.translate(0, 0.25, 0); legR.translate(0.09, 0, 0);

  const merged = mergeGeometries([body, head, armL, armR, legL, legR]);

  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.85, metalness: 0,
  });

  const COUNT = 80;
  crowdMesh = new THREE.InstancedMesh(merged, mat, COUNT);
  crowdMesh.castShadow = true;
  crowdMesh.receiveShadow = true;

  const dummy = new THREE.Object3D();
  const color = new THREE.Color();
  const palette = [
    [0.18, 0.20, 0.22], [0.28, 0.32, 0.36], [0.46, 0.50, 0.55],
    [0.13, 0.18, 0.30], [0.30, 0.40, 0.55], [0.55, 0.32, 0.20],
    [0.42, 0.28, 0.16], [0.65, 0.55, 0.40], [0.20, 0.22, 0.28], [0.70, 0.30, 0.22],
  ];
  for (let i = 0; i < COUNT; i++) {
    // Distribute around the perimeter, biased toward the avenue side
    const baseA = Math.random() * Math.PI * 2;
    const a = (Math.random() < 0.4)
      ? AVENUE_AZIMUTH + (Math.random() - 0.5) * 1.4
      : baseA;
    const r = 39 + Math.random() * 7;
    const x = Math.sin(a) * r;
    const z = -Math.cos(a) * r;
    dummy.position.set(x, 0, z);
    dummy.rotation.y = a + Math.PI + (Math.random() - 0.5) * 1.6;
    const heightScale = 0.93 + Math.random() * 0.18;
    const widthScale  = 0.88 + Math.random() * 0.22;
    dummy.scale.set(widthScale, heightScale, widthScale);
    dummy.updateMatrix();
    crowdMesh.setMatrixAt(i, dummy.matrix);

    const p = palette[i % palette.length];
    color.setRGB(
      Math.max(0, Math.min(1, p[0] + (Math.random() - 0.5) * 0.10)),
      Math.max(0, Math.min(1, p[1] + (Math.random() - 0.5) * 0.10)),
      Math.max(0, Math.min(1, p[2] + (Math.random() - 0.5) * 0.10)),
    );
    crowdMesh.setColorAt(i, color);
  }
  crowdMesh.instanceMatrix.needsUpdate = true;
  if (crowdMesh.instanceColor) crowdMesh.instanceColor.needsUpdate = true;
  scene.add(crowdMesh);
}
makeCrowd();

/* ============================================================
   COMPASS OVERLAY
   ============================================================ */
const compassGroup = new THREE.Group();
compassGroup.visible = false;
function makeCompass() {
  const cardinal = new THREE.LineBasicMaterial({ color: 0xffe9a0, transparent: true, opacity: 0.75 });
  const avenue   = new THREE.LineBasicMaterial({ color: 0xff7a5a, transparent: true, opacity: 0.9 });

  const dirs = [
    { name: 'N', az: 0 },
    { name: 'E', az: 90 * DEG },
    { name: 'S', az: 180 * DEG },
    { name: 'W', az: 270 * DEG },
  ];
  for (const d of dirs) {
    const x = Math.sin(d.az) * 50;
    const z = -Math.cos(d.az) * 50;
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0.06, 0),
      new THREE.Vector3(x, 0.06, z),
    ]);
    compassGroup.add(new THREE.Line(g, cardinal));
  }
  // Avenue line
  const ax = Math.sin(AVENUE_AZIMUTH) * 80;
  const az = -Math.cos(AVENUE_AZIMUTH) * 80;
  const ag = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0.07, 0),
    new THREE.Vector3(ax, 0.07, az),
  ]);
  compassGroup.add(new THREE.Line(ag, avenue));

  // Direction tick rings every 10m
  for (let r = 10; r <= 50; r += 10) {
    const pts = [];
    const segs = 64;
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.sin(a) * r, 0.06, -Math.cos(a) * r));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    compassGroup.add(new THREE.Line(g, cardinal));
  }
}
makeCompass();
scene.add(compassGroup);

/* ============================================================
   SUN POSITION + ATMOSPHERIC BINDING
   ============================================================ */
const SUN_DIST = 300;
function updateSun(azimuthDeg, elevationDeg) {
  const az = azimuthDeg * DEG;
  const el = elevationDeg * DEG;
  const x =  Math.sin(az) * Math.cos(el) * SUN_DIST;
  const y =  Math.sin(el) * SUN_DIST;
  const z = -Math.cos(az) * Math.cos(el) * SUN_DIST;
  sun.position.set(x, y, z);
  sun.target.position.set(0, 0, 0);
  sun.target.updateMatrixWorld();

  skyMat.uniforms.uSunDir.value.set(x, y, z).normalize();

  const t = Math.max(0, Math.min(1, elevationDeg / 25));
  const lowColor  = new THREE.Color(0xffba70);
  const highColor = new THREE.Color(0xfff5dc);
  const sunColor  = lowColor.clone().lerp(highColor, t);
  sun.color.copy(sunColor);
  skyMat.uniforms.uSunColor.value.copy(sunColor);

  if (elevationDeg < 0) {
    sun.intensity = Math.max(0, 0.6 + elevationDeg * 0.12);
    hemi.intensity = 0.18;
    ambient.intensity = 0.05;
    renderer.toneMappingExposure = 0.85;
  } else {
    sun.intensity = 1.1 + t * 1.8;
    hemi.intensity = 0.30 + t * 0.40;
    ambient.intensity = 0.06 + t * 0.08;
    renderer.toneMappingExposure = 1.0 + t * 0.15;
  }

  const horizonHaze = (1 - t) * 0.5;
  scene.fog.color.setRGB(
    0.78 + horizonHaze * 0.10,
    0.83 - horizonHaze * 0.02,
    0.87 - horizonHaze * 0.10
  );
}
updateSun(51, 15);

/* ============================================================
   UI
   ============================================================ */
const ui = {
  az:       document.getElementById('az'),
  el:       document.getElementById('el'),
  wind:     document.getElementById('wind'),
  crowd:    document.getElementById('crowdT'),
  compass:  document.getElementById('compassT'),
  reset:    document.getElementById('reset'),
  solstice: document.getElementById('solstice'),
  vAz:      document.getElementById('vAz'),
  vEl:      document.getElementById('vEl'),
  vWind:    document.getElementById('vWind'),
};

function syncSun() {
  const az = parseFloat(ui.az.value);
  const el = parseFloat(ui.el.value);
  ui.vAz.textContent = az.toFixed(0) + '°';
  ui.vEl.textContent = el.toFixed(0) + '°';
  updateSun(az, el);
}
function syncWind() {
  const w = parseFloat(ui.wind.value);
  ui.vWind.textContent = w.toFixed(2);
  if (grassUniforms) grassUniforms.uWind.value = w;
}
ui.az.addEventListener('input', syncSun);
ui.el.addEventListener('input', syncSun);
ui.wind.addEventListener('input', syncWind);
ui.crowd.addEventListener('change', () => { crowdMesh.visible = ui.crowd.checked; });
ui.compass.addEventListener('change', () => { compassGroup.visible = ui.compass.checked; });
ui.reset.addEventListener('click', avenueView);
ui.solstice.addEventListener('click', () => {
  ui.az.value = 51;
  ui.el.value = 15;
  syncSun();
});
syncSun();
syncWind();

/* ============================================================
   ADAPTIVE GRASS DENSITY
   ============================================================ */
function updateGrassDensity() {
  if (!grassMesh) return;
  const dist = camera.position.distanceTo(controls.target);
  const camY = camera.position.y;
  let factor;
  if (dist < 25)      factor = 1.0;
  else if (dist < 60) factor = 0.78;
  else if (dist < 110) factor = 0.5;
  else                factor = 0.28;
  if (camY > 30)  factor *= 0.65;
  if (camY > 70)  factor *= 0.55;
  grassMesh.count = Math.floor(GRASS_MAX * factor);
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const fpsEl = document.getElementById('fps');
let prev = performance.now();
let fpsCounter = 0, fpsTime = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;

  if (grassUniforms) grassUniforms.uTime.value = now * 0.001;
  updateGrassDensity();
  controls.update();
  renderer.render(scene, camera);

  fpsCounter++; fpsTime += dt;
  if (fpsTime > 0.5) {
    const fps = fpsCounter / fpsTime;
    fpsEl.textContent = fps.toFixed(0) + ' fps';
    fpsCounter = 0; fpsTime = 0;
  }
}

/* ============================================================
   STARTUP
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Reveal UI, hide loader, kick off the loop.
document.getElementById('loader').style.display = 'none';
document.getElementById('ui').style.display = 'block';
requestAnimationFrame(animate);
</script>
