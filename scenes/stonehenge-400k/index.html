<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stonehenge — Solstice Light</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div class="title">STONEHENGE · Solstice Light</div>
  <div class="row">
    <label>Sun Azimuth <span id="azv"></span>°</label>
    <input type="range" id="az" min="0" max="360" step="0.5" value="49" />
  </div>
  <div class="row">
    <label>Sun Elevation <span id="elv"></span>°</label>
    <input type="range" id="el" min="-5" max="80" step="0.5" value="12" />
  </div>
  <div class="row">
    <label>Grass Wind <span id="wv"></span></label>
    <input type="range" id="wind" min="0" max="3" step="0.01" value="0.9" />
  </div>
  <div class="row inline">
    <label><input type="checkbox" id="crowd" checked /> Crowd</label>
    <label><input type="checkbox" id="compass" /> Compass</label>
  </div>
  <div class="row inline">
    <button id="solstice">Summer Solstice Sunrise</button>
    <button id="reset">Reset to Avenue</button>
  </div>
  <div class="meta"><span id="fps">— fps</span> · <span id="info">drag to orbit · scroll to dolly</span></div>
</div>

<div id="compass-overlay">
  <svg viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet">
    <circle cx="0" cy="0" r="92" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="0.4"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="rgba(255,255,255,.18)" stroke-width="0.4"/>
    <line x1="0" y1="-95" x2="0" y2="95" stroke="rgba(255,255,255,.18)" stroke-width="0.4"/>
    <line id="sun-line" x1="0" y1="0" x2="0" y2="-92" stroke="#ffd089" stroke-width="1.2"/>
    <line id="avenue-line" x1="-66" y1="66" x2="66" y2="-66" stroke="rgba(255,200,140,.6)" stroke-width="0.6" stroke-dasharray="3 3"/>
    <text x="0" y="-78" fill="rgba(255,255,255,.7)" font-size="10" text-anchor="middle">N</text>
    <text x="78" y="4" fill="rgba(255,255,255,.45)" font-size="8" text-anchor="middle">E</text>
    <text x="0" y="86" fill="rgba(255,255,255,.45)" font-size="8" text-anchor="middle">S</text>
    <text x="-78" y="4" fill="rgba(255,255,255,.45)" font-size="8" text-anchor="middle">W</text>
  </svg>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
